server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: hmdp

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:hmdp}?useSSL=false&serverTimezone=UTC
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}

  data:
    redis:
      database: ${REDIS_DATABASE:0}
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s

  jackson:
    default-property-inclusion: non_null  #JSON处理时忽略空字符串

mybatis-plus:
  type-aliases-package: com.hmdp.entity  #别名扫描包

logging:
  level:
    com.hmdp: debug


    #理解四处变化：
    #- MySQL 驱动类改为 com.mysql.cj.jdbc.Driver。
    #- Redis 配置从 spring.redis 移到 spring.data.redis。
    #- 上传配置放到 spring.servlet.multipart，修正原文件的层级。
    #- MYSQL_PASSWORD 从启动环境读取，移除源码中的密码默认值。